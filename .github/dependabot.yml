version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      lint-toolchain:
        patterns:
          - "@effect/tsgo"
          - "oxlint"
          - "oxlint-tsgolint"
          - "typescript"
      dev-tooling:
        patterns:
          - "*"
        dependency-type: "development"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
