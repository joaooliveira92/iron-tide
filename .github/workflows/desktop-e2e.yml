name: Desktop E2E Gate

on:
  push:
    branches: [dev, main]
    paths:
      - "apps/desktop/**"
      - "content/production/1880/**"
      - ".github/workflows/desktop-e2e.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PATTERN: '^(apps/desktop/|content/production/1880/|\.github/workflows/desktop-e2e\.yml$)'
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -Eq "$PATTERN"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  desktop-e2e:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The app hard-depends on the compiled content artifact; build it
      # explicitly before the E2E suite and packaging so a green run cannot
      # mean tests/packaging used a stale or missing artifact.
      - name: Build the compiled content artifact
        run: pnpm content:build
      - name: Compile the engine-only replay child
        run: pnpm --filter @bluewave/desktop typecheck
      - run: pnpm --filter @bluewave/desktop test:e2e
      - name: Package the app (unpacked)
        run: CSC_IDENTITY_AUTO_DISCOVERY=false pnpm --filter @bluewave/desktop exec electron-builder --mac --dir --config electron-builder.json
      # The smoke starts a fresh game, which is the path that reads the shipped
      # content artifact from app resources (ticket 05); no precompiled save.
      - name: Smoke the packaged app
        run: pnpm --filter @bluewave/desktop run smoke:packaged
      # The reviewer's visible evidence: the drawing board as rendered from the
      # shipped artifact, captured on every smoke run (CRI-PKG-3).
      - name: Upload the packaged smoke screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaged-smoke-screenshot
          path: apps/desktop/test-results/packaged-smoke.png
          if-no-files-found: ignore
      # Debug-build acceptance slice: the campaign battle drill spec needs the
      # debug-gated main-process command + debug UI, so it runs against a
      # `VITE_BLUEWAVE_DEBUG=true` build (excluded from the default run above via
      # `testIgnore`). Rebuild AFTER packaging so the release artifacts stay on
      # the normal build.
      - name: Build the app in debug mode
        run: pnpm --filter @bluewave/desktop run build:debug
      - name: Run the debug-only E2E drill spec
        run: pnpm --filter @bluewave/desktop run test:e2e:debug
      - name: Upload test-results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-e2e-test-results
          path: apps/desktop/test-results

  desktop-e2e-ok:
    name: desktop-e2e-ok
    if: always()
    needs: [scope, desktop-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the scope decision and, when in scope, the E2E run
        env:
          SCOPE: ${{ needs.scope.result }}
          RUN: ${{ needs.scope.outputs.run }}
          RESULT: ${{ needs.desktop-e2e.result }}
        run: |
          if [ "$SCOPE" != "success" ]; then
            echo "::error::scope finished as $SCOPE"
            exit 1
          fi
          if [ "$RUN" = "true" ] && [ "$RESULT" != "success" ]; then
            echo "::error::desktop-e2e finished as $RESULT"
            exit 1
          fi
