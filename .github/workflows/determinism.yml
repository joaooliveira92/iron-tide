name: Determinism Gate

# Pushes to dev and pull requests into dev run Ubuntu only: delivery into dev is
# a local merge (ADR-0234), so a push trigger is what puts the unit suites and
# golden hashes under CI on the integration branch. Pull requests into main, manual
# dispatches, and the nightly run run the full Ubuntu, Windows and macOS matrix.
# GitHub fires `schedule` only from the default branch's copy of this file, so
# the nightly run starts once this file reaches main; it checks out dev
# explicitly rather than the default branch.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: determinism-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      - id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "push" ] || { [ "$EVENT_NAME" = "pull_request" ] && [ "$BASE_REF" = "dev" ]; }; then
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          fi
  determinism:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # build first (fresh), then typecheck: some desktop tests spawn a `tsc -b`
      # child (researchDeterminismChild.js), and building before typechecking
      # avoids the task-cache replay that bites when typecheck runs first.
      - run: pnpm build
      - run: pnpm typecheck
      # The runners have few cores; the task runner's default concurrency
      # oversubscribes them and tips heavy-but-legitimate suites past their
      # timeouts. The `--concurrency-limit` flag must precede the task specifier
      # so `vp run` consumes it; placed after `test` it is forwarded to each
      # package's test script, where vitest rejects it (`--concurrencyLimit`).
      - run: pnpm exec vp run -r --concurrency-limit=2 test
      - name: Cross-process determinism
        run: node packages/cross-process-test/dist/run-child.js
      # Replay corpus (ADR-0246): every golden/replays file re-executed through the
      # real engine in two fresh processes on each OS; output must be identical and a
      # divergence prints the first-divergence report. CI only verifies; it never
      # records or approves a replay.
      - name: Replay corpus
        run: pnpm check:replay-corpus
      # Writes the hashes this runner observed, then fails on any missing,
      # extra or different key against golden/hashes.json.
      - name: Verify golden hashes
        run: node scripts/verify-golden-hashes.cjs --write-observed observed-hashes.json
      - name: Upload observed hashes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: observed-hashes-${{ matrix.os }}
          path: observed-hashes.json
          if-no-files-found: ignore
