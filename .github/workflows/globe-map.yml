name: Globe Map Production

# Cross-OS proof for the default globe Overview renderer: the committed pack
# verifies, the bake is deterministic on each OS, the adapter suite passes, and
# the unpacked package contains only the allow-listed runtime map assets.
on:
  push:
    branches: [dev, main]
    paths:
      - "apps/desktop/map-assets/**"
      - "apps/desktop/src/renderer/components/globe-adapter/**"
      - "apps/desktop/src/renderer/components/globe-spike/**"
      - "apps/desktop/scripts/map-data/**"
      - "apps/desktop/scripts/package-guard/**"
      - "apps/desktop/package-policy/**"
      - ".github/workflows/globe-map.yml"
  pull_request:
    paths:
      - "apps/desktop/map-assets/**"
      - "apps/desktop/src/renderer/components/globe-adapter/**"
      - "apps/desktop/src/renderer/components/globe-spike/**"
      - "apps/desktop/scripts/map-data/**"
      - "apps/desktop/scripts/package-guard/**"
      - "apps/desktop/package-policy/**"
      - ".github/workflows/globe-map.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: globe-map-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  globe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify the committed offline pack
        run: pnpm --filter @bluewave/desktop map-assets:verify
      - name: Verify the bake is byte-identical on this OS
        run: |
          pnpm --filter @bluewave/desktop map-data fetch
          pnpm --filter @bluewave/desktop map-data determinism
      - name: Globe adapter unit and accessibility suites
        run: pnpm --filter @bluewave/desktop exec vp test run src/renderer/components/globe-adapter src/renderer/components/globe-spike scripts/package-guard
      - name: Package the app (unpacked)
        run: CSC_IDENTITY_AUTO_DISCOVERY=false pnpm --filter @bluewave/desktop exec electron-builder ${{ matrix.target }} --dir --config electron-builder.yml
      - name: Enforce the production package policy
        run: pnpm --filter @bluewave/desktop exec node scripts/package-guard/cli.ts --mode default --package dist-electron
