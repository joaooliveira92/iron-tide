nations:
  - countryId: gb
    nationId: uk
    code: GB
    markerColour: "#c8102e"
    coordinates:
      lat: 51.5
      lng: -0.1
      label: London
    flavor:
      name: United Kingdom
      economy: The world's foremost industrial power, sustained by empire-wide trade and unrivalled colonial revenues. The City of London finances navies and railways on every continent.
      military: The Royal Navy holds undisputed command of the seas. The two-power standard demands a battle fleet stronger than the next two naval powers combined, a bar set deliberately out of reach.
      diplomacy: Britain fears a Franco-Russian entente that could threaten trade routes and colonial possessions simultaneously. The priority is preserving the balance of power without a costly continental commitment.
    dossier:
      appointmentTitle: First Sea Lord
      doctrine: Global sea control, two-power standard
      strategicRegions: North Sea, Mediterranean, Indian Ocean, Far East, overseas possessions
      budgetCategory: Very Large
      shipbuildingCapacity: World-leading
      researchStrengths: Capital ship design, naval gunnery
      researchWeaknesses: Overstretched budget across theaters
      nationalCharacteristics: Worldwide deployment burden; public expects naval supremacy
      likelyRivals:
        - Germany
        - France
        - Russia
      difficulty: 5
  - countryId: de
    nationId: germany
    code: DE
    markerColour: "#111111"
    coordinates:
      lat: 52.5
      lng: 13.4
      label: Berlin
    flavor:
      name: German Empire
      economy: A rapidly industrialising colossus — steel output already challenging Britain's, chemical and electrical industries decades ahead of their rivals. Prussia's fiscal discipline underpins every programme.
      military: The most powerful land army in the world, but a navy still in its infancy. Strategic ambition is building pressure to match industrial growth with blue-water capability.
      diplomacy: Berlin fears encirclement by a Franco-Russian alliance and works to keep the two apart. Colonial ambitions are growing, putting steady friction into relations with London and Paris.
    dossier:
      appointmentTitle: State Secretary of the Imperial Naval Office
      doctrine: Risk fleet, high-seas concentration
      strategicRegions: North Sea, Baltic
      budgetCategory: Large
      shipbuildingCapacity: Advanced, fast-growing
      researchStrengths: Metallurgy, engine design
      researchWeaknesses: Shallow overseas basing network
      nationalCharacteristics: Rapid industrial expansion; political pressure to rival Britain
      likelyRivals:
        - United Kingdom
        - France
        - Russia
      difficulty: 4
  - countryId: us
    nationId: usa
    code: US
    markerColour: "#b22234"
    coordinates:
      lat: 38.9
      lng: -77
      label: Washington
    flavor:
      name: United States
      economy: Continental expansion has created a vast internal market; industrialisation is accelerating. The economy is the largest in the Americas and growing fast, though it remains inward-looking.
      military: The Civil War navy has rusted to near-irrelevance. A modernisation programme is underway, but the fleet is still coastal-defence oriented — offensive sea power remains a prospect rather than a fact.
      diplomacy: The Monroe Doctrine insists the Western Hemisphere is a closed sphere. Washington fears European intervention in Latin American affairs above all else, and watches the Pacific with growing interest.
    dossier:
      appointmentTitle: Chief of Naval Operations
      doctrine: Hemispheric defense, emerging blue-water ambition
      strategicRegions: Atlantic seaboard, Caribbean, Pacific coast
      budgetCategory: Large
      shipbuildingCapacity: Advanced, expanding fast
      researchStrengths: Industrial capacity, shipyard scale
      researchWeaknesses: Limited overseas basing, inexperienced officer corps
      nationalCharacteristics: Isolationist public opinion; growing two-ocean strategic problem
      likelyRivals:
        - United Kingdom
        - Japan
      difficulty: 3
  - countryId: jp
    nationId: japan
    code: JP
    markerColour: "#bc002d"
    coordinates:
      lat: 35.7
      lng: 139.7
      label: Tokyo
    flavor:
      name: Empire of Japan
      economy: The Meiji government is industrialising at breakneck speed. Traditional feudal revenues are giving way to modern taxation, but foreign exchange is scarce and heavy industry is still in its infancy.
      military: The army is reorganised on French lines; the embryonic navy is acquiring foreign-built warships. Both services are improving rapidly, though foreign advisers still fill key gaps.
      diplomacy: Tokyo seeks treaty revision to escape the unequal agreements imposed by the Western powers. Its primary fear is Russian southward expansion cutting off Korea — a buffer Japan considers vital.
    dossier:
      appointmentTitle: Chief of the Imperial Japanese Navy General Staff
      doctrine: Decisive-battle doctrine, regional sea denial
      strategicRegions: Home waters, Yellow Sea, Western Pacific
      budgetCategory: Moderate, growing
      shipbuildingCapacity: Developing, rapidly modernizing
      researchStrengths: Crew discipline, torpedo tactics
      researchWeaknesses: Smaller industrial base than Western rivals
      nationalCharacteristics: Rapid modernization; strong national naval ambition
      likelyRivals:
        - Russia
        - China
        - United States
      difficulty: 3
  - countryId: fr
    nationId: france
    code: FR
    markerColour: "#00209f"
    coordinates:
      lat: 48.9
      lng: 2.3
      label: Paris
    flavor:
      name: French Republic
      economy: A wealthy but slower-growing economy compared to Germany and Britain. Colonial revenues are rising, but the Franco-Prussian indemnity left scars and the birth rate lags behind rivals.
      military: The army is rebuilt and enlarged since 1871, consumed by revanchism for Alsace-Lorraine. The navy is the world's second largest by tonnage but starved of funds compared with the army.
      diplomacy: Paris fears German aggression above all and actively courts Russian friendship to avoid fighting alone. Colonial rivalry with Britain over Africa and south-east Asia is a persistent secondary tension.
    dossier:
      appointmentTitle: Chief of the Naval General Staff
      doctrine: Coastal defense plus colonial cruiser warfare
      strategicRegions: Mediterranean, Atlantic, colonial routes
      budgetCategory: Large
      shipbuildingCapacity: Advanced
      researchStrengths: Submarine and torpedo innovation
      researchWeaknesses: Fleet doctrine inconsistency between administrations
      nationalCharacteristics: Political instability affecting naval policy continuity
      likelyRivals:
        - Germany
        - United Kingdom
        - Italy
      difficulty: 4
  - countryId: it
    nationId: italy
    code: IT
    markerColour: "#008c45"
    coordinates:
      lat: 41.9
      lng: 12.5
      label: Rome
    flavor:
      name: Kingdom of Italy
      economy: Unification is recent and the south remains mired in poverty. Industry is concentrated in the north and heavily dependent on imported coal. State finances are under chronic strain.
      military: The army is large by necessity but poorly equipped. The navy is ambitious — Italy sees sea power as the only path to great-power status — but funds are limited and shipyards are still developing.
      diplomacy: Rome covets the Adriatic coast and a voice in the Mediterranean. Its fears are Austria-Hungary to the north and France to the west. The Triple Alliance provides cover but limits freedom of action.
    dossier:
      appointmentTitle: Chief of Staff of the Regia Marina
      doctrine: Mediterranean coastal defense
      strategicRegions: Central Mediterranean, Adriatic
      budgetCategory: Moderate
      shipbuildingCapacity: Developing
      researchStrengths: Cruiser and light-forces design
      researchWeaknesses: Limited heavy-industry capacity
      nationalCharacteristics: Constrained budget relative to ambitions
      likelyRivals:
        - France
        - Austria-Hungary
      difficulty: 3
  - countryId: ru
    nationId: russia
    code: RU
    markerColour: "#0039a6"
    coordinates:
      lat: 55.8
      lng: 37.6
      label: Moscow
    flavor:
      name: Russian Empire
      economy: Vast natural resources but chronically underdeveloped. Railway construction is the central modernisation project. Foreign loans sustain the budget, and serfdom's recent abolition disrupts traditional agricultural revenues.
      military: The largest army in the world by manpower, though logistics over vast distances limit its effectiveness. The navy is divided between Baltic, Black Sea, and Pacific — powerful on paper, overstretched in practice.
      diplomacy: St Petersburg pursues warm-water ports with persistence — in the Black Sea, in the Far East, and through the Balkans. It fears British resistance in the south and Austro-Hungarian competition for Slavic influence.
    dossier:
      appointmentTitle: Chief of the Naval Staff
      doctrine: Fleet-in-being, coastal and regional defense
      strategicRegions: Baltic, Black Sea, Far East
      budgetCategory: Moderate
      shipbuildingCapacity: Developing, uneven
      researchStrengths: Numerical manpower
      researchWeaknesses: Split fleet across disconnected theaters, industrial backwardness
      nationalCharacteristics: Political instability; logistically fragmented navy
      likelyRivals:
        - Japan
        - Germany
        - United Kingdom
      difficulty: 3
  - countryId: ah
    nationId: austria_hungary
    code: AH
    markerColour: "#c8102e"
    coordinates:
      lat: 48.2
      lng: 16.4
      label: Vienna
    flavor:
      name: Austro-Hungarian Empire
      economy: A dual monarchy of uneven halves — industrial Bohemia and Vienna on one side, agrarian Hungary on the other. Internal customs disputes slow modernisation; the empire punches below its potential weight.
      military: A substantial land army stretched thin along long frontiers. The navy operates only in the Adriatic and is modest in ambition, though technologically capable.
      diplomacy: Vienna's primary fear is Russian-backed pan-Slavic nationalism dissolving the empire from within. Ambitions in the Balkans are constrained by the need to avoid triggering a general war with St Petersburg.
    dossier:
      appointmentTitle: Marinekommandant
      doctrine: Coastal and Adriatic defense
      strategicRegions: Adriatic Sea
      budgetCategory: Modest
      shipbuildingCapacity: Limited
      researchStrengths: Coastal fortification integration
      researchWeaknesses: Minimal blue-water experience
      nationalCharacteristics: Multi-ethnic empire constrains unified naval policy
      likelyRivals:
        - Italy
      difficulty: 2
  - countryId: es
    nationId: spain
    code: ES
    markerColour: "#f1bf00"
    coordinates:
      lat: 40.4
      lng: -3.7
      label: Madrid
    flavor:
      name: Kingdom of Spain
      economy: Colonial revenues are declining as Cuba and the Philippines demand expensive garrisons. The domestic economy is agricultural and slow to industrialise; state finances are precarious.
      military: An ageing fleet, mostly of iron warships that missed the last generation of modernisation. Manpower is available but the defence budget cannot support a sustained naval programme.
      diplomacy: Madrid's overriding concern is protecting Cuba, the Philippines, and the remaining colonial estate. The rising power of the United States in the Western Hemisphere is watched with growing unease.
    dossier:
      appointmentTitle: Chief of the Naval General Staff
      doctrine: Colonial and home-waters defense
      strategicRegions: Iberian coast, remaining colonial possessions
      budgetCategory: Limited
      shipbuildingCapacity: Minimal
      researchStrengths: Coastal familiarity
      researchWeaknesses: Post-1898 fleet rebuilding from a low base
      nationalCharacteristics: Recovering from recent naval losses; modest ambitions
      likelyRivals:
        - France
        - United Kingdom
      difficulty: 1
  - countryId: qing
    nationId: qing
    code: QIN
    markerColour: "#ffde00"
    coordinates:
      lat: 39.9
      lng: 116.4
      label: Beijing
    flavor:
      name: Qing Dynasty
      economy: An enormous economy on paper — the world's most populous state — but commercially stagnant under unfavourable treaty tariffs and lacking modern industry. Foreign loans are the only source of capital for naval programmes.
      military: Modernisation is fragmented across regional fleets with no unified command. The Beiyang Fleet is the strongest, equipped with German-built ironclads, but discipline and logistics remain weak.
      diplomacy: Peking fears partition by the European powers most of all, with Britain pressing from the south, Russia from the north, France from Indochina, and Japan emerging as a new threat from the east.
    dossier:
      appointmentTitle: Imperial Naval Commissioner
      doctrine: Coastal defense, treaty-port protection
      strategicRegions: Yellow Sea, coastal treaty ports
      budgetCategory: Limited
      shipbuildingCapacity: Minimal
      researchStrengths: Manpower reserves
      researchWeaknesses: Fragmented command, minimal domestic shipbuilding industry
      nationalCharacteristics: Foreign naval pressure in home waters; weak central industrial base
      likelyRivals:
        - Japan
        - United Kingdom
      difficulty: 2
