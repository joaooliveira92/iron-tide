# Reference environment for design validation until campaign facilities and threats are wired (SB-14b).
# Threat penetrations: 12in/25 sourced (521 mm iron at 1,000 yd); QF values are ESTIMATE.
environment:
  threats:
    - { id: bl_12in, penetrationUm: 521000 }
    - { id: bl_92in, penetrationUm: 300000 }
    - { id: qf_6in, penetrationUm: 150000 }
    - { id: qf_47in, penetrationUm: 100000 }
    - { id: qf_12pdr, penetrationUm: 50000 }
    # Pre-1880 rifled muzzle-loaders (point-blank wrought-iron perforation, Brassey's Naval Annual 1886 French
    # Commission table; docs/research/ship-building-1880-pre-era-armament.md). The expected adversary of the 1880 ships.
    - { id: rml_16in, penetrationUm: 740000 }
    - { id: rml_125in, penetrationUm: 460000 }
    - { id: rml_12in, penetrationUm: 370000 }
    - { id: rml_10in, penetrationUm: 300000 }
    - { id: rml_9in, penetrationUm: 250000 }
  # Yards (ADR-0067 section 6). Per-line capacity is maxDisplacement(t) x yardWorkPerTonneMonth, so a bigger yard works faster and
  # the "limited by <line>" bottleneck is meaningful. Limits and rate are ESTIMATES: sized to the 1880-1900 hull classes
  # (destroyer/torpedo boat, cruiser, battleship), not to named historical slips.
  facilities:
    - {
        id: yard_small,
        maxLengthMm: 110000,
        maxBeamMm: 15000,
        maxDisplacementKg: 3000000,
        craneLiftKg: 80000,
      }
    - {
        id: yard_medium,
        maxLengthMm: 150000,
        maxBeamMm: 22000,
        maxDisplacementKg: 9000000,
        craneLiftKg: 150000,
      }
    - {
        id: yard_large,
        maxLengthMm: 200000,
        maxBeamMm: 40000,
        maxDisplacementKg: 30000000,
        craneLiftKg: 250000,
      }
  # Rate (SECONDARY, derived): work micro-units per tonne of maxDisplacement per month per line. Brassey 1901 pp. 18-19 launch
  # weights give 250-364 t of hull per month on a battleship slip (Russell 5,950 t in 23 months, Montagu 4,987 t in 15.4, Albemarle
  # 5,100 t in 14). At 40,000 work per hull tonne the record (364 t/month) on the 30,000 t yard is 364 x 40,000 / 30,000 = 485;
  # 480 is used so the record yards stay reachable: a Majestic hull's capacity schedule is about 30 months, under its historical time.
  yardWorkPerTonneMonth: 480
  # Engine projection: displacement per hit point; the median of the 37 authored 1880-pack designs is ~214,000 kg.
  kgPerHitPoint: 214000
  # Micro-pounds per treasury unit: one unit of campaign treasury and project work is GBP 10,000. Calibrated so a Majestic-class battleship
  # costs about as many units as the original displacement formula gave (about 125); designed ships are priced by the cost model.
  treasuryUnitMicro: 10000000000
# Revision tiers for changes during construction (spec section 15.4, ADR-0070). These are GAME-DESIGN CONSTANTS, not historical data, so
# no source exists for them; they are decided here and checked by `checkRevisionBalance` (ranges, ascending thresholds, a redesign never
# milder than a revision). Not yet play-tested: tune from play, never to fit a source.
#   freeBelowBp / revisionBelowBp / redesignBelowBp: hull-progress thresholds, 5 / 25 / 50 percent (spec).
#   reworkBp: a revision (T1) redoes 30 % of the work already done on what it changes.
#   redesignKeptBp: a redesign (T2) keeps 50 % of the hull work (the structure is salvaged, the rest is scrapped).
#   t1DelayMonths: 1 (spec: at least one month). t2DelayMonths: 4, a third of a year of redrawing and re-laying plates.
#   redesignStudyCostBp: UNUSED until design studies exist (DESIGN-21 section 3); the multiplier is carried so the rule is complete.
revision:
  freeBelowBp: 500
  revisionBelowBp: 2500
  redesignBelowBp: 5000
  reworkBp: 3000
  t1DelayMonths: 1
  redesignStudyCostBp: 6000
  redesignKeptBp: 5000
  t2DelayMonths: 4
  # In-place design-revision limits (manual printed p27; ADR-0132): displacement +10 % or 1000 t (whichever is larger),
  # speed +/-1 kn, vertical armour +/-1 in, horizontal armour +/-0.5 in, main guns above 6 in unchangeable.
  inPlace:
    displacementIncreaseBp: 1000
    displacementMinAllowanceKg: 1000000
    speedChangeMilliKnots: 1000
    verticalArmourChangeUm: 25400
    horizontalArmourChangeUm: 12700
    mainGunMaxUm: 152400

# Rebuild validation (ticket 28; DESIGN-23 section 21 "rebuild_validation_v1"). These are the rule's own shipped values, not
# placeholders: displacement +20 %, designed speed +3 kn, hull length and beam +/-5 %. A change of hull form is always refused.
rebuild:
  maxDisplacementIncreaseBp: 2000
  maxSpeedIncreaseMilliKnots: 3000
  maxLengthChangeBp: 500
  maxBeamChangeBp: 500

# Design studies (DESIGN-21 sections 3 and 18, ADR-0085). The discount is the rule's own (2,500 bp, permitted 1,500-3,500; minimums
# exactly 1). The base work and cost are not given by the rules, so they are decided game-design constants, not historical data:
#   costBp: a study costs 3 % of the design's first ship (rounded up, at least 1 treasury unit).
#   baseWorkMonths: 4 months of design-office work, so a new class is approved in the fifth month after it is submitted.
study:
  costBp: 300
  baseWorkMonths: 4
  derivedDiscountBp: 2500
  minFinalWork: 1
  minFinalCost: 1
