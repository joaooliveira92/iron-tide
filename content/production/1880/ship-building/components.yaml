# Ship-building component catalogue, EARLY band (1880-1899).
# Source of every figure: docs/research/ship-building-early-band.md. Confidence labels (VERIFIED / SINGLE-SOURCE / ESTIMATE / UNVERIFIED)
# are kept in comments. PLACEHOLDER = no source in the research note; must be replaced before release (ticket SB-12 follow-up).
# Units: kg, mm, litres, kW, budget micro-units, bp. Formulas use the restricted grammar of @bluewave/ship-design.
components:
  # --- Pre-1880 ordnance (guns in service by January 1880) -------------------------------------------------------------------
  # Source of record: docs/research/ship-building-1880-pre-era-armament.md. Masses, charges, projectiles and muzzle velocity of
  # the British RMLs are VERIFIED from Mackinlay, Text Book of Gunnery 1887, Table XVI (primary); penetration is Brassey's Naval
  # Annual 1886 French Commission table (point-blank, wrought iron). Mount masses and rates of fire are ESTIMATE (no source).
  # `requires: []` because these muzzle-loaders predate the breech-loading technology; the introduction month gates them to 1880+.
  # The `barrels` parameter doubles as "guns grouped in one battery mount" for broadside/central-battery ships (a game abstraction).
  # 16in/80-ton: gun 81,284 kg, shell 764 kg, charge 204 kg prismatic brown, 1,590 fps, ~0.33 rds/min ESTIMATE. [TB87] VERIFIED.
  - id: gun_rml_16in_80ton
    displayName: "RML 16-inch 80-ton gun in turret"
    category: MAIN_GUN
    introduction: { fromMonth: "1880-01", obsoleteMonth: null }
    requires: []
    parameters: { barrels: { min: 1, max: 6, step: 1 }, rounds: { min: 20, max: 120, step: 5 } }
    constants:
      {
        gun_kg: 81284,
        mount_per_barrel_kg: 40000,
        mount_fixed_kg: 25000,
        cost_per_kg_micro: 123000,
        mount_cost_micro: 10000000000,
      }
    weightKg: "(gun_kg + mount_per_barrel_kg) * barrels + mount_fixed_kg"
    volumeLitre: "3 * (gun_kg + mount_per_barrel_kg) * barrels" # PLACEHOLDER: 3 L per kg of gun+mount
    costMicro: "gun_kg * barrels * cost_per_kg_micro + mount_cost_micro * barrels" # gun GBP 10,000 (Brassey 1882 p.95, VERIFIED)
    crew: "14 * barrels"
    powerKw: "1 * barrels"
    upgradePath: []
    tags: [gun, heavy]
    deckFootprintMm2: "470 * (gun_kg + mount_per_barrel_kg) * barrels" # PLACEHOLDER: 470 mm2 per kg
    heightMm: "3200"
    zCgMm: "6500"
    fcClass: heavy
    attributes:
      caliberUm: "406000"
      shellMassG: "764000"
      chargeBp: "2670" # charge 204 / shell 764 x 10000
      roundVolumeMl: "382000" # ESTIMATE: 0.5 mL per gram of round
      rofBaseX100: "30"
      beamArcDeg: "120"
      maxFeedPermille: "250"
