    introduction: { fromMonth: "1880-01", obsoleteMonth: null }
    requires: []
    parameters: {}
    constants: { cap_litre: 8000 }
    weightKg: "0" # 0: already inside the fitted hull weight (White 1894 pp. 409-410 count this fitting in "weight of hull"; ADR-0083)
    volumeLitre: "9000"
    costMicro: "300000000"
    crew: "2"
    powerKw: "0"
    upgradePath: [magazine_medium]
    tags: [magazine]
    critical: true
    deckFootprintMm2: "4000000"
    heightMm: "2200"
