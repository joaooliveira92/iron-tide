    volumeLitre: "30600 * barrels"
    costMicro: "gun_kg * barrels * cost_per_kg_micro + mount_cost_micro * barrels"
    crew: "3 * barrels"
    powerKw: "1 * barrels"
    upgradePath: []
    tags: [gun, medium]
