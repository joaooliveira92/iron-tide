    lengthMinMm: 24000
    lengthMaxMm: 70000
    lbMinX100: 800
    lbMaxX100: 1200
    formBp: 10309
    waterplaneCoeffBp: 7200
    sheerBp: 11000
    volumeFullnessBp: 5500
    deckFullnessBp: 7000
    lcbPermille: 500
    zones: &a1
      - id: FORECASTLE
        startPermille: 0
        endPermille: 80
        volumeBp: 500
        deckAreaBp: 1200
        buoyancyBp: 800
