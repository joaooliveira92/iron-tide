        startPermille: 180
        endPermille: 280
        volumeBp: 1100
        deckAreaBp: 900
        buoyancyBp: 1000
      - id: CENTRAL_MACHINERY
        startPermille: 280
        endPermille: 520
        volumeBp: 2800
        deckAreaBp: 1500
        buoyancyBp: 2400
      - id: SUPERSTRUCTURE
        startPermille: 520
        endPermille: 640
        volumeBp: 1200
        deckAreaBp: 1500
        buoyancyBp: 1200
      - id: AFT_SERVICE
        startPermille: 640
        endPermille: 760
        volumeBp: 1100
        deckAreaBp: 900
        buoyancyBp: 1200
      - id: AFT_MAGAZINE
        startPermille: 760
        endPermille: 900
        volumeBp: 1000
        deckAreaBp: 900
        buoyancyBp: 1400
      - id: QUARTERDECK
        startPermille: 900
        endPermille: 1000
