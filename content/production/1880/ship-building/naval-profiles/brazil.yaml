# National naval profiles (NationNavalProfile) for the EARLY band, one file per nation.
# Every historical value carries a provenance block (sourceStatus / confidence / kind / sources); every balance
# target is labelled `balance_adjustment`. Grounding: docs/research/<nation>-naval-profile.md.
# Hard capability only ever restricts (UNAVAILABLE families, calibre ceilings); it never grants. Soft doctrine
# steers templates, AI scoring and procurement, and never blocks a legal design (docs/ships-nation-orientation.md).
navalProfiles:
  # Brazil (canonical id "brazil"). The largest South American navy but a small river-and-coast force: Paraguayan-War
  # river monitors and casemate ironclads, a few cruisers and torpedo boats, regional rivalry with Argentina and
  # Chile, imported Whitworth/Armstrong/Krupp guns. Non-playable in 1880 but in the scenario.
  # Grounding: docs/research/brazil-naval-profile.md.
  - nationId: brazil
    activeFrom: "1880-01"
    activeUntil: null
    strategicSituation: >-
      Regional river-and-coast power: the largest navy in South America, built on Paraguayan-War monitors and a
      casemate ironclad with a few cruisers and torpedo boats, focused on the Plate and Paraná and on regional
      superiority over Argentina and Chile; heavy guns and armour are imported.
    hardCapabilities:
      maxGunCaliberUm: 305000
      maxArmourThicknessUm: 305000
      domesticTorpedoDiameterUm: 356000
      hullForms:
        [
          torpedo_boat_form,
          protected_cruiser_form,
          coast_defence_form,
          pre_dreadnought_form,
          merchant_liner_form,
        ]
      domesticPlants: [compound_cylindrical, triple_expansion_cylindrical]
      restrictedShipTypes: []
      grants: []
    softPreferences:
      speedOverArmourBp: 5000
      secondaryBatteryWeightBp: 10000
      enduranceWeightBp: 9500
      riskToleranceBp: 5000
      colonialServiceWeightBp: 9000
      torpedoOnCruisersBp: 10000
      accommodationStandard: SPARTAN
    industrialProfile:
      buildTimeMultiplierBp: 10500
      costMultiplierBp: 10500
      machineryReliabilityBp: 8500
      constructionQualityVarianceBp: 4400
      maxPracticalDisplacementKg:
        - { fromMonth: "1880-01", value: 2200000 }
        - { fromMonth: "1885-01", value: 2500000 }
        - { fromMonth: "1890-01", value: 4000000 }
      heavyGunProduction: IMPORTED
      armourPlateProduction: IMPORTED
      provenance:
        sourceStatus: ESTIMATE
        confidence: MEDIUM
        kind: balance_adjustment
        note: "Arsenal de Marinha plus small private yards; capital ships imported. BALANCE TARGET within ±15%."
        sources:
          - {
              sourceId: "brazil-note",
              title: "National naval profile research note — Brazil",
              page: "B",
            }
          - { sourceId: "navypedia-br", title: "navypedia.org Brazilian class pages" }
        derivation:
          {
            sourceValue: "largest domestic hull 2,174 t; Riachuelo built in Britain",
            sourceUnit: "estimate",
            conversion: "within the ±15% band",
            gameValue: "buildTimeMultiplierBp 10500, costMultiplierBp 10500",
            roundingRule: "±15%",
          }
    dock:
      maximumNewConstructionMassKg: 5000000
      maximumMajorRepairMassKg: 5000000
      maximumRebuildMassKg: 5000000
      maximumConversionMassKg: 5000000
      provenance:
        sourceStatus: DERIVED
        confidence: MEDIUM
        kind: game_conversion
        sources:
          - { title: "1880 national dock capacity research note", page: "findings table" }
        derivation:
          {
            sourceValue: "scenario CA starter 4,865 t (largest 1880 hull); Sete de Setembro 2,174 t",
            sourceUnit: "t",
            conversion: "largest 1880 hull the nation fields, rounded up to the next 1,000 t dock step",
            gameValue: "maximumNewConstructionMassKg 5000000",
            roundingRule: "ceiling to next 1,000 t",
          }
        note: "max(historical flagship 2,174 t, scenario largest hull 4,865 t) rounded up to the next 1,000 t"
    doctrineProfile:
      engagementRangeM: 1500
      hePreferenceBp: 4000
      postures: [regional_warfare, coastal_defence]
      provenance:
