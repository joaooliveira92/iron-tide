# National naval profiles (NationNavalProfile) for the EARLY band, one file per nation.
# Every historical value carries a provenance block (sourceStatus / confidence / kind / sources); every balance
# target is labelled `balance_adjustment`. Grounding: docs/research/<nation>-naval-profile.md.
# Hard capability only ever restricts (UNAVAILABLE families, calibre ceilings); it never grants. Soft doctrine
# steers templates, AI scoring and procurement, and never blocks a legal design (docs/ships-nation-orientation.md).
navalProfiles:
  # Japan (canonical id "japan"). A newly-modernising Meiji island state building its first IJN almost entirely from
  # foreign (chiefly British) yards and designs: a small ironclad/corvette fleet, coastal and Yellow-Sea regional
  # focus, no colonial empire yet, and high receptiveness to foreign technology. Grounding: docs/research/japan-naval-profile.md.
  - nationId: japan
    activeFrom: "1880-01"
    activeUntil: null
    strategicSituation: >-
      Modernising island state building its first navy abroad: a handful of British-built ironclads and corvettes, a
      regional coastal focus in the Yellow Sea and around Korea, no colonial empire, and an eager, uncritical adoption
      of foreign guns, machinery and torpedoes.
    hardCapabilities:
      maxGunCaliberUm: 305000
      maxArmourThicknessUm: 305000
      domesticTorpedoDiameterUm: 356000
      hullForms:
        [
          torpedo_boat_form,
          protected_cruiser_form,
          coast_defence_form,
          pre_dreadnought_form,
          merchant_liner_form,
        ]
      domesticPlants: [compound_cylindrical, triple_expansion_cylindrical]
      restrictedShipTypes: []
      grants: []
    softPreferences:
      speedOverArmourBp: 6000
      secondaryBatteryWeightBp: 10000
      enduranceWeightBp: 9500
      riskToleranceBp: 7000
      colonialServiceWeightBp: 9500
      torpedoOnCruisersBp: 12000
      accommodationStandard: SPARTAN
    industrialProfile:
      buildTimeMultiplierBp: 10800
      costMultiplierBp: 11000
      machineryReliabilityBp: 8600
      constructionQualityVarianceBp: 3500
      maxPracticalDisplacementKg:
        - { fromMonth: "1880-01", value: 4000000 }
        - { fromMonth: "1885-01", value: 4500000 }
        - { fromMonth: "1890-01", value: 5000000 }
      heavyGunProduction: IMPORTED
      armourPlateProduction: IMPORTED
      provenance:
        sourceStatus: ESTIMATE
        confidence: MEDIUM
        kind: balance_adjustment
        note: "Small domestic yards; capital ships bought abroad. Multipliers are BALANCE TARGET within ±15%."
        sources:
          - {
              sourceId: "japan-note",
              title: "National naval profile research note — Japan",
              page: "B",
            }
          - { sourceId: "navypedia-jp", title: "navypedia.org Japanese class pages" }
        derivation:
          {
            sourceValue: "import-dependent navy; small domestic yards",
            sourceUnit: "estimate",
            conversion: "within the ±15% band",
            gameValue: "buildTimeMultiplierBp 10800, costMultiplierBp 11000",
            roundingRule: "±15%",
          }
    dock:
      maximumNewConstructionMassKg: 5000000
      maximumMajorRepairMassKg: 5000000
      maximumRebuildMassKg: 5000000
      maximumConversionMassKg: 5000000
      provenance:
        sourceStatus: DERIVED
        confidence: MEDIUM
        kind: game_conversion
        sources:
          - { title: "1880 national dock capacity research note", page: "findings table" }
        derivation:
          {
            sourceValue: "scenario CA starter 4,865 t (largest 1880 hull); Fuso 3,720 t",
            sourceUnit: "t",
            conversion: "largest 1880 hull the nation fields, rounded up to the next 1,000 t dock step",
            gameValue: "maximumNewConstructionMassKg 5000000",
            roundingRule: "ceiling to next 1,000 t",
          }
        note: "max(historical flagship 3,720 t, scenario largest hull 4,865 t) rounded up to the next 1,000 t"
    doctrineProfile:
      engagementRangeM: 1500
      hePreferenceBp: 3500
      postures: [regional_warfare, coastal_defence, torpedo_warfare]
      provenance:
        sourceStatus: ESTIMATE
        confidence: MEDIUM
        kind: historical_fact
        sources:
