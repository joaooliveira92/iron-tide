              sourceId: "japan-note",
              title: "National naval profile research note — Japan",
              page: "A, C",
            }
          - { sourceId: "navypedia-jp", title: "navypedia.org Japanese class pages" }
    researchPreferences:
      - { field: GUNNERY, priority: 4 }
      - { field: INFRASTRUCTURE, priority: 4 }
      - { field: TORPEDOES, priority: 3 }
      - { field: SHIP_DESIGN, priority: 3 }
      - { field: MACHINERY, priority: 2 }
