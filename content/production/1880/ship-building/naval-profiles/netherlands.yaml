              title: "National naval profile research note — Netherlands",
              page: "A, C",
            }
          - { sourceId: "navypedia-nl", title: "navypedia.org Dutch class pages" }
    researchPreferences:
      - { field: HULL_CONSTRUCTION, priority: 3 }
      - { field: INFRASTRUCTURE, priority: 3 }
      - { field: MACHINERY, priority: 3 }
      - { field: MINES_AND_ASW, priority: 3 }
      - { field: GUNNERY, priority: 2 }
      - { field: TORPEDOES, priority: 2 }
      - { field: SHIP_DESIGN, priority: 2 }
      - { field: DAMAGE_CONTROL, priority: 2 }
      - { field: FIRE_CONTROL, priority: 1 }
      - { field: SUBMARINES, priority: 1 }
    componentAccess:
