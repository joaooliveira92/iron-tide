# National naval profiles (NationNavalProfile) for the EARLY band, one file per nation.
# Every historical value carries a provenance block (sourceStatus / confidence / kind / sources); every balance
# target is labelled `balance_adjustment`. Grounding: docs/research/<nation>-naval-profile.md.
# Hard capability only ever restricts (UNAVAILABLE families, calibre ceilings); it never grants. Soft doctrine
# steers templates, AI scoring and procurement, and never blocks a legal design (docs/ships-nation-orientation.md).
navalProfiles:
  # Ottoman Empire (canonical id "ottoman_empire"). The besieged Straits guardian: a large-on-paper but decaying
  # foreign-built ironclad fleet, coast-defence and Black-Sea/Straits focus, imported Armstrong guns, weak finances
  # and industry. Non-playable in 1880 but present in the scenario. Grounding: docs/research/ottoman_empire-naval-profile.md.
  - nationId: ottoman_empire
    activeFrom: "1880-01"
    activeUntil: null
    strategicSituation: >-
      Besieged Straits guardian: a large-on-paper but decaying ironclad fleet, mostly foreign-built and laid up, held
      for coast defence of the Dardanelles and Bosphorus and for Black-Sea security against Russia; guns and armour
      are imported and the fleet is not replaced at the rate it decays.
    hardCapabilities:
      maxGunCaliberUm: 305000
      maxArmourThicknessUm: 305000
      domesticTorpedoDiameterUm: 356000
      hullForms:
        [
          torpedo_boat_form,
          protected_cruiser_form,
          coast_defence_form,
          pre_dreadnought_form,
          merchant_liner_form,
        ]
      domesticPlants: [compound_cylindrical]
      restrictedShipTypes: []
      grants: []
    softPreferences:
      speedOverArmourBp: 4500
      secondaryBatteryWeightBp: 10500
      enduranceWeightBp: 9500
      riskToleranceBp: 4500
      colonialServiceWeightBp: 9000
      torpedoOnCruisersBp: 10000
      accommodationStandard: SPARTAN
    industrialProfile:
      buildTimeMultiplierBp: 10900
      costMultiplierBp: 11100
      machineryReliabilityBp: 7800
      constructionQualityVarianceBp: 4500
      maxPracticalDisplacementKg:
        - { fromMonth: "1880-01", value: 9000000 }
        - { fromMonth: "1885-01", value: 9000000 }
        - { fromMonth: "1890-01", value: 9500000 }
      heavyGunProduction: IMPORTED
      armourPlateProduction: IMPORTED
      provenance:
        sourceStatus: ESTIMATE
        confidence: MEDIUM
        kind: balance_adjustment
        note: "Slow Tersâne-i Âmire yards, imported Armstrong guns and armour; multipliers are BALANCE TARGET within ±15%."
        sources:
          - {
              sourceId: "ottoman-note",
              title: "National naval profile research note — Ottoman Empire",
              page: "B",
            }
          - { sourceId: "navypedia-ot", title: "navypedia.org Ottoman class pages" }
        derivation:
          {
            sourceValue: "decaying foreign-built fleet; no modern domestic yard",
            sourceUnit: "estimate",
            conversion: "within the ±15% band",
            gameValue: "buildTimeMultiplierBp 10900, costMultiplierBp 11100",
            roundingRule: "±15%",
          }
    dock:
      maximumNewConstructionMassKg: 9000000
      maximumMajorRepairMassKg: 9000000
      maximumRebuildMassKg: 9000000
      maximumConversionMassKg: 9000000
      provenance:
        sourceStatus: DERIVED
        confidence: MEDIUM
        kind: game_conversion
        sources:
          - { title: "1880 national dock capacity research note", page: "findings table" }
        derivation:
