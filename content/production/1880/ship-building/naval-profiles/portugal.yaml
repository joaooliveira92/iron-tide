# National naval profiles (NationNavalProfile) for the EARLY band, one file per nation.
# Every historical value carries a provenance block (sourceStatus / confidence / kind / sources); every balance
# target is labelled `balance_adjustment`. Grounding: docs/research/<nation>-naval-profile.md.
# Hard capability only ever restricts (UNAVAILABLE families, calibre ceilings); it never grants. Soft doctrine
# steers templates, AI scoring and procurement, and never blocks a legal design (docs/ships-nation-orientation.md).
navalProfiles:
  # Portugal (canonical id "portugal"). The oldest and poorest western-European empire: one small British-built,
  # Krupp-armed coast-defence ironclad plus sloops, colonial gunboats and a spar torpedo boat, guarding Lisbon and
  # the African/Asian colonies with no domestic heavy-gun or armour industry. Non-playable in 1880 but in the
  # scenario. Grounding: docs/research/portugal-naval-profile.md.
  - nationId: portugal
    activeFrom: "1880-01"
    activeUntil: null
    strategicSituation: >-
      Poor old empire on the defensive: a single British-built, Krupp-armed coast-defence ironclad, a few sloops,
      colonial gunboats and one spar torpedo boat, tasked with port defence at Lisbon and patrol of Angola,
      Mozambique, Goa, Macau and Timor, with no domestic heavy-gun or armour-plate industry.
    hardCapabilities:
      maxGunCaliberUm: 305000
      maxArmourThicknessUm: 305000
      domesticTorpedoDiameterUm: 356000
      hullForms:
        [
          torpedo_boat_form,
          protected_cruiser_form,
          coast_defence_form,
          pre_dreadnought_form,
          merchant_liner_form,
        ]
      domesticPlants: [compound_cylindrical]
      restrictedShipTypes: []
      grants: []
    softPreferences:
      speedOverArmourBp: 4500
      secondaryBatteryWeightBp: 9500
      enduranceWeightBp: 10500
      riskToleranceBp: 4000
      colonialServiceWeightBp: 12000
      torpedoOnCruisersBp: 9000
      accommodationStandard: SPARTAN
    industrialProfile:
      buildTimeMultiplierBp: 10800
      costMultiplierBp: 10900
      machineryReliabilityBp: 8200
      constructionQualityVarianceBp: 3500
      maxPracticalDisplacementKg:
        - { fromMonth: "1880-01", value: 1400000 }
        - { fromMonth: "1885-01", value: 1400000 }
        - { fromMonth: "1890-01", value: 2000000 }
      heavyGunProduction: IMPORTED
      armourPlateProduction: IMPORTED
      provenance:
        sourceStatus: ESTIMATE
        confidence: MEDIUM
        kind: balance_adjustment
        note: "Tiny Arsenal da Marinha yards, ships bought abroad; multipliers are BALANCE TARGET within ±15%."
        sources:
          - {
              sourceId: "portugal-note",
              title: "National naval profile research note — Portugal",
              page: "B",
            }
          - { sourceId: "navypedia-pt", title: "navypedia.org Portuguese class pages" }
        derivation:
          {
            sourceValue: "largest domestic hull 1,406 t; ironclad and cruisers built abroad",
            sourceUnit: "estimate",
            conversion: "within the ±15% band",
            gameValue: "buildTimeMultiplierBp 10800, costMultiplierBp 10900",
            roundingRule: "±15%",
          }
    dock:
      maximumNewConstructionMassKg: 5000000
      maximumMajorRepairMassKg: 5000000
      maximumRebuildMassKg: 5000000
      maximumConversionMassKg: 5000000
      provenance:
        sourceStatus: DERIVED
        confidence: MEDIUM
        kind: game_conversion
        sources:
          - { title: "1880 national dock capacity research note", page: "findings table" }
        derivation:
          {
            sourceValue: "scenario CA starter 4,865 t (largest 1880 hull); Vasco da Gama 2,384 t",
            sourceUnit: "t",
            conversion: "largest 1880 hull the nation fields, rounded up to the next 1,000 t dock step",
            gameValue: "maximumNewConstructionMassKg 5000000",
            roundingRule: "ceiling to next 1,000 t",
          }
        note: "max(historical flagship 2,384 t, scenario largest hull 4,865 t) rounded up to the next 1,000 t"
    doctrineProfile:
      engagementRangeM: 1500
