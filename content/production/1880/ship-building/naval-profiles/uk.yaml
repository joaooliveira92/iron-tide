# National naval profiles (NationNavalProfile) for the EARLY band, one file per nation.
# Every historical value carries a provenance block (sourceStatus / confidence / kind / sources); every balance
# target is labelled `balance_adjustment`. Grounding: docs/research/<nation>-naval-profile.md.
# Hard capability only ever restricts (UNAVAILABLE families, calibre ceilings); it never grants. Soft doctrine
# steers templates, AI scoring and procurement, and never blocks a legal design (docs/ships-nation-orientation.md).
navalProfiles:
  - nationId: uk
    activeFrom: "1880-01"
    activeUntil: null
    strategicSituation: >-
      Global battle-fleet power with the world's largest cruiser and coaling-station obligation: the two-Power
      standard held the battle line while trade protection and overseas stations demanded long-range cruisers,
      colonial gunboats and the world's largest shipbuilding industry.
    hardCapabilities:
      maxGunCaliberUm: 343000
      maxArmourThicknessUm: 457000
      domesticTorpedoDiameterUm: 356000
      hullForms:
        [
          torpedo_boat_form,
          protected_cruiser_form,
          coast_defence_form,
          pre_dreadnought_form,
          merchant_liner_form,
        ]
      domesticPlants:
        [
          compound_cylindrical,
          triple_expansion_cylindrical,
          triple_expansion_watertube,
          compound_locomotive_tb,
          locomotive_boiler_tb,
        ]
      restrictedShipTypes: []
      grants: []
    softPreferences:
      speedOverArmourBp: 5000
      secondaryBatteryWeightBp: 10500
      enduranceWeightBp: 14000
      riskToleranceBp: 4000
      colonialServiceWeightBp: 12500
      torpedoOnCruisersBp: 9000
      accommodationStandard: STANDARD
    industrialProfile:
      buildTimeMultiplierBp: 9300
      costMultiplierBp: 9800
      machineryReliabilityBp: 9000
      constructionQualityVarianceBp: 2000
      maxPracticalDisplacementKg:
        - { fromMonth: "1880-01", value: 10000000 }
        - { fromMonth: "1885-01", value: 12000000 }
        - { fromMonth: "1890-01", value: 15000000 }
      heavyGunProduction: DOMESTIC
      armourPlateProduction: DOMESTIC
      provenance:
        sourceStatus: ESTIMATE
        confidence: MEDIUM
        kind: balance_adjustment
        sources:
          - {
              title: "Brassey, The British Navy vol. II",
              author: "T. A. Brassey",
              year: 1882,
              page: "95 (gun costs)",
              archiveOrUrl: "britishnavyitss04brasgoog",
            }
          - { title: "National naval profiles research note", page: "A.1.2" }
        derivation:
          {
            sourceValue: "250-360 t hull/month per slip (Duncan, 1899-1901)",
            sourceUnit: "t/month",
            conversion: "faster than the 1894 baseline",
            gameValue: "buildTimeMultiplierBp 9300",
            roundingRule: "within the ±15% band",
          }
    dock:
      maximumNewConstructionMassKg: 13000000
      maximumMajorRepairMassKg: 13000000
      maximumRebuildMassKg: 13000000
      maximumConversionMassKg: 13000000
      provenance:
        sourceStatus: DERIVED
        confidence: MEDIUM
        kind: game_conversion
        sources:
          - { title: "1880 national dock capacity research note", page: "findings table" }
        derivation:
          {
            sourceValue: "scenario B starter 12,679 t (Majestic-like, largest 1880 hull); HMS Inflexible 11,880 t",
            sourceUnit: "t",
            conversion: "largest 1880 hull the nation fields, rounded up to the next 1,000 t dock step",
            gameValue: "maximumNewConstructionMassKg 13000000",
            roundingRule: "ceiling to next 1,000 t",
          }
        note: "max(historical flagship 11,880 t, scenario largest hull 12,679 t) rounded up to the next 1,000 t"
    doctrineProfile:
      engagementRangeM: 2000
      hePreferenceBp: 2000
      postures: [battle_fleet_concentration, colonial_presence, commerce_defence]
      provenance:
        sourceStatus: DERIVED
        confidence: MEDIUM
        kind: historical_fact
        sources:
          - { title: "National naval profiles research note", page: "A.1.1, A.1.3" }
    researchPreferences:
      - { field: MACHINERY, priority: 4 }
      - { field: HULL_CONSTRUCTION, priority: 3 }
      - { field: GUNNERY, priority: 3 }
      - { field: INFRASTRUCTURE, priority: 3 }
      - { field: DAMAGE_CONTROL, priority: 2 }
      - { field: FIRE_CONTROL, priority: 2 }
      - { field: TORPEDOES, priority: 2 }
      - { field: SHIP_DESIGN, priority: 2 }
      - { field: MINES_AND_ASW, priority: 1 }
      - { field: SUBMARINES, priority: 1 }
    componentAccess:
