# National naval profiles (NationNavalProfile) for the EARLY band, one file per nation.
# Every historical value carries a provenance block (sourceStatus / confidence / kind / sources); every balance
# target is labelled `balance_adjustment`. Grounding: docs/research/<nation>-naval-profile.md.
# Hard capability only ever restricts (UNAVAILABLE families, calibre ceilings); it never grants. Soft doctrine
# steers templates, AI scoring and procurement, and never blocks a legal design (docs/ships-nation-orientation.md).
navalProfiles:
  # United States (canonical id "usa"). A secure continental republic with a tiny, obsolescent post-Civil-War navy in
  # retrenchment: Civil-War coast-defence monitors, no seagoing ironclad, a small cruising force, a huge latent
  # industry and little political appetite for naval spending. Grounding: docs/research/usa-naval-profile.md.
  - nationId: usa
    activeFrom: "1880-01"
    activeUntil: null
    strategicSituation: >-
      Continental republic in naval retrenchment: the fleet is a coast-defence monitor force plus a few wooden
      cruisers, with no seagoing ironclad, no modern breech-loading heavy gun and no service torpedo; doctrine is
      coastal and hemispheric, spending is minimal, but the industrial base is enormous and latent.
    hardCapabilities:
      maxGunCaliberUm: 381000
      maxArmourThicknessUm: 279000
      domesticTorpedoDiameterUm: 356000
      hullForms:
        [
          torpedo_boat_form,
          protected_cruiser_form,
          coast_defence_form,
          pre_dreadnought_form,
          destroyer_form,
          postwar_destroyer_form,
          light_cruiser_form,
          heavy_cruiser_form,
          merchant_liner_form,
        ]
      domesticPlants: [compound_cylindrical, hp_steam_geared_turbine]
      restrictedShipTypes: []
      grants: []
    softPreferences:
      speedOverArmourBp: 4800
      secondaryBatteryWeightBp: 9500
      enduranceWeightBp: 10000
      riskToleranceBp: 4500
      colonialServiceWeightBp: 9500
      torpedoOnCruisersBp: 6500
      accommodationStandard: STANDARD
    industrialProfile:
      buildTimeMultiplierBp: 10500
      costMultiplierBp: 10000
      machineryReliabilityBp: 8900
      constructionQualityVarianceBp: 3200
      maxPracticalDisplacementKg:
        - { fromMonth: "1880-01", value: 6000000 }
        - { fromMonth: "1885-01", value: 8000000 }
        - { fromMonth: "1890-01", value: 11000000 }
        - { fromMonth: "1940-01", value: 25000000 }
      heavyGunProduction: DOMESTIC
      armourPlateProduction: DOMESTIC
      provenance:
        sourceStatus: ESTIMATE
        confidence: MEDIUM
        kind: balance_adjustment
        note: "Rusty post-1868 yards and a real heavy-gun gap; multipliers are BALANCE TARGET within ±15%."
        sources:
          - {
              sourceId: "usa-note",
              title: "National naval profile research note — United States",
              page: "B",
            }
          - {
              sourceId: "bras86",
              title: "The Naval Annual 1886",
              author: "T. A. Brassey (ed.)",
              year: 1886,
              page: "33-34, 505-507",
            }
        derivation:
          {
            sourceValue: "1868-85 programme spent with little to show; gun-foundry gap",
            sourceUnit: "estimate",
            conversion: "within the ±15% band",
            gameValue: "buildTimeMultiplierBp 10500, costMultiplierBp 10000",
            roundingRule: "±15%",
          }
    dock:
      maximumNewConstructionMassKg: 5000000
      maximumMajorRepairMassKg: 5000000
      maximumRebuildMassKg: 5000000
      maximumConversionMassKg: 5000000
      provenance:
        sourceStatus: DERIVED
        confidence: MEDIUM
        kind: game_conversion
        sources:
          - { title: "1880 national dock capacity research note", page: "findings table" }
        derivation:
          {
            sourceValue: "scenario CA starter 4,865 t (largest 1880 hull); Amphitrite 3,990 t",
            sourceUnit: "t",
            conversion: "largest 1880 hull the nation fields, rounded up to the next 1,000 t dock step",
            gameValue: "maximumNewConstructionMassKg 5000000",
            roundingRule: "ceiling to next 1,000 t",
          }
        note: "max(historical flagship 3,990 t, scenario largest hull 4,865 t) rounded up to the next 1,000 t"
    doctrineProfile:
      engagementRangeM: 1200
      hePreferenceBp: 5500
      postures: [coastal_defence, commerce_defence, regional_warfare]
      provenance:
