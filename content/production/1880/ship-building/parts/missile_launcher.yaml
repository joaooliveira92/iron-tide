      sourceStatus: BALANCE_TARGET
      confidence: LOW
      kind: balance_adjustment
      sources:
        - title: "Rule the Waves 3 manual"
          author: "Naval War Simulations / Matrix Games"
          year: 2023
          page: "121-123"
          section: "Light surface-to-surface missile family"
      note: "ADR-0312. The manual grounds the light SSM family and gives no mass, cost or crew. The canister launcher and its balance-target weight, cost and crew are derived from the nearest light armament fitting and dated 1955 per ADR-0283 D2/D5. All three launcher parts share the existing mis_heavy_ssm technology so adding them moves no replay checkpoint."
