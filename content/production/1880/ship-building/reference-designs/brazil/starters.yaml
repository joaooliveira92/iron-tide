# Reference designs for the EARLY band (starting points for the Drawing Board and regression fixtures).
# One directory per nation: starters.yaml (a `starterFor` opening design) and historical.yaml.
# Fittings (magazines, quarters, pumps, ventilation) weigh nothing extra (White 1894, ADR-0083).
designs:
  # Sete de Setembro (1874, in service Jan 1880): Brazilian casemate ironclad, 2,174 t, 12 kn, 4 x 300-pdr Whitworth
  # 9-in (229 mm) RML in a central casemate, 114 mm belt/casemate. Modelled as two side mounts of two guns to satisfy
  # B's 1-2 main-mount rule. Promoted to the Brazilian capital (B) starter (ADR-0119), replacing the doctrine clone.
  # Source: docs/research/ship-building-1880-ships-by-nation.md §6.11; armament §2.3.
  - id: sete_de_setembro_1874
    starterFor: B
    name: Sete de Setembro (1874, casemate ironclad)
    month: 1880-01
    historical: true
    provenance:
      completionDate:
        value: "4.7.1874"
        status: DERIVED
        sources:
          [{ title: "naval-encyclopedia.com (industrial-era/the-imperial-brazilian-navy.php)" }]
      displacementBasis:
        value: "2,174 t"
        status: DERIVED
        sources:
          [{ title: "naval-encyclopedia.com (industrial-era/the-imperial-brazilian-navy.php)" }]
      armourScheme:
        value: "wrought iron; belt 114, casemate 114, deck 12.7"
        status: DERIVED
        sources:
          [{ title: "naval-encyclopedia.com (industrial-era/the-imperial-brazilian-navy.php)" }]
      armamentConfiguration:
        value: "4x1 300-pdr Whitworth RML in a central casemate (pivot); 2-pdr + Nordenfelt/Hotchkiss machine guns; no torpedoes documented (Brazil bought 4 torpedo boats by 1879)"
        status: DERIVED
        sources:
          [{ title: "naval-encyclopedia.com (industrial-era/the-imperial-brazilian-navy.php)" }]
      machineryOutput:
        value: "2 shafts compound, 4 boilers; 2,000 ihp"
        status: DERIVED
        sources:
          [{ title: "naval-encyclopedia.com (industrial-era/the-imperial-brazilian-navy.php)" }]
      speed:
        value: "12 kn"
        status: DERIVED
        sources:
          [{ title: "naval-encyclopedia.com (industrial-era/the-imperial-brazilian-navy.php)" }]
    draft:
      nationId: brazil
      requirement:
        category: B
        requiredSpeedMilliKnots: 12000
        cruiseSpeedMilliKnots: 7000
        requiredRangeNm: 1200
        designThreatId: qf_6in
        modernizationExpectation: NONE
        crewQualityBp: 10000
        accommodationStandard: STANDARD
        protectionGoal: STANDARD
      hull:
        hullFormId: coast_defence_form
        lengthWl: 73400
        beam: 14200
        draught: 3810
        depthToMainDeck: 6500
        blockCoeffBp: 6000
        materialId: iron
        structuralSchemeId: mixed
        subdivisionGrade: 2
        targetDisplacementKg: 2174000
        limitDisplacementKg: null
        designMarginBp: 300
        growthReserveBp: 0
      machinery:
        plantId: compound_cylindrical
        installedKw: 1500
        zoneId: CENTRAL_MACHINERY
        stationPermille: 500
        fuelCapacityKg: 150000
        fuelZoneId: CENTRAL_MACHINERY
        fuelStationPermille: 510
        foulingBp: 0
      armour:
        regions:
          - {
              region: BELT_MAIN,
              thicknessUm: 114000,
              lengthMm: 73400,
              heightMm: 3000,
              materialId: wrought_iron,
              cosObliquityBp: 10000,
            }
          - {
              region: BARBETTE,
              thicknessUm: 114000,
              lengthMm: 30000,
              heightMm: 3000,
              materialId: wrought_iron,
              cosObliquityBp: 10000,
            }
          - {
              region: MAGAZINE_BOX,
              thicknessUm: 114000,
              lengthMm: 25000,
              heightMm: 2400,
              materialId: wrought_iron,
              cosObliquityBp: 10000,
            }
        citadelLengthMm: 45000
        torpedoWarheadKg: 0
        bunkerProtectionBp: 0
      placements:
        - {
            instanceId: main_p,
            componentId: gun_rml_229mm_whitworth,
            zoneId: SUPERSTRUCTURE,
            stationPermille: 550,
            side: PORT,
            params: { barrels: 2, rounds: 50 },
            magazineRef: mag_main,
          }
        - {
            instanceId: main_s,
