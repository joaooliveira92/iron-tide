# Reference designs for the EARLY band (starting points for the Drawing Board and regression fixtures).
# One directory per nation: starters.yaml (a `starterFor` opening design) and historical.yaml.
# Fittings (magazines, quarters, pumps, ventilation) weigh nothing extra (White 1894, ADR-0083).
designs:
  # SMS Sachsen (1878): German central-citadel armoured corvette, 7,677 t, 13.5 kn, 6x 26-cm RK, 10-in iron belt.
  - id: sachsen_1878
    name: Sachsen (1878, armoured corvette)
    month: 1880-01
    starterFor: B
    historical: true
    provenance:
      completionDate:
        value: "20.10.1878 (only Sachsen of the class in service Jan 1880; Bayern and Wuerttemberg 1881, Baden 1883)"
        status: DERIVED
        sources: [{ title: "navypedia.org (germany/ger_bb_sachsen.htm)" }]
      displacementBasis:
        value: "7,677 t normal / 7,935 t full (Sachsen)"
        status: DERIVED
        sources: [{ title: "navypedia.org (germany/ger_bb_sachsen.htm)" }]
      armourScheme:
        value: "wrought iron (patented sandwich); citadel 254-203 sides, 152 transverse bulkheads, deck 75-50, barbettes 254, CT 140"
        status: DERIVED
        sources: [{ title: "navypedia.org (germany/ger_bb_sachsen.htm)" }]
      armamentConfiguration:
        value: "6x1 263 mm (10.2-in) RKL/22 C/76 in four barbettes; 6x1 87 mm RKL/24 + 8x1 37 mm SK; no torpedo tubes as built (3x350 mm 1886)"
        status: DERIVED
        sources: [{ title: "navypedia.org (germany/ger_bb_sachsen.htm)" }]
      machineryOutput:
        value: "2 HSE, 8 rectangular boilers, 2 shafts; 5,000 ihp"
        status: DERIVED
        sources: [{ title: "navypedia.org (germany/ger_bb_sachsen.htm)" }]
      speed:
        value: "13.5 kn; 1,940 nmi at 10 kn"
        status: DERIVED
        sources: [{ title: "navypedia.org (germany/ger_bb_sachsen.htm)" }]
    draft:
      nationId: germany
      requirement:
        category: B
        requiredSpeedMilliKnots: 13500
        cruiseSpeedMilliKnots: 8000
        requiredRangeNm: 1940
        designThreatId: rml_10in
        modernizationExpectation: MINOR
        crewQualityBp: 10000
        accommodationStandard: SPARTAN
        protectionGoal: STANDARD
      hull:
        hullFormId: coast_defence_form
        lengthWl: 93000
        beam: 18400
        draught: 7000
        depthToMainDeck: 10000
        blockCoeffBp: 6300
        materialId: iron
        structuralSchemeId: mixed
        subdivisionGrade: 2
        targetDisplacementKg: 7677000
        limitDisplacementKg: null
        designMarginBp: 300
        growthReserveBp: 300
      machinery:
        plantId: compound_cylindrical
        installedKw: 4700
        zoneId: CENTRAL_MACHINERY
        stationPermille: 400
        fuelCapacityKg: 700000
        fuelZoneId: CENTRAL_MACHINERY
        fuelStationPermille: 450
        foulingBp: 0
        rooms:
          - { zoneId: CENTRAL_MACHINERY, stationPermille: 400, shareBp: 6000 }
          - { zoneId: AFT_SERVICE, stationPermille: 680, shareBp: 4000 }
      armour:
        regions:
          - {
              region: BELT_MAIN,
              thicknessUm: 254000,
              lengthMm: 60000,
              heightMm: 3200,
              materialId: wrought_iron,
              cosObliquityBp: 10000,
            }
          - {
              region: DECK_MAIN,
              thicknessUm: 75000,
              lengthMm: 93000,
              heightMm: 18400,
              materialId: wrought_iron,
