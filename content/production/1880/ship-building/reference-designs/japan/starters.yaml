# Reference designs for the EARLY band (starting points for the Drawing Board and regression fixtures).
# One directory per nation: starters.yaml (a `starterFor` opening design) and historical.yaml.
# Fittings (magazines, quarters, pumps, ventilation) weigh nothing extra (White 1894, ADR-0083).
designs:
  # Fusō (1878, in service Jan 1880): Japanese central-battery ironclad, 3,717 t, 13 kn, 4 x 235 mm Krupp RKL/22 in a
  # central battery + 2 x 173 mm RKL/25, 229 mm belt/battery. The 235 mm main battery is modelled as two side mounts of
  # two guns to satisfy B's 1-2 main-mount rule. Promoted to the Japanese capital (B) starter (ADR-0119). Source:
  # docs/research/ship-building-1880-ships-by-nation.md §6.4; armament §2.4.
  - id: fuso_1878
    starterFor: B
    name: Fusō (1878, central-battery ironclad)
    month: 1880-01
    historical: true
    provenance:
      completionDate:
        value: "1.1878"
        status: DERIVED
        sources: [{ title: "navypedia.org (japan/jap_bb_fuso78.htm)" }]
      displacementBasis:
        value: "3,717 t normal"
        status: DERIVED
        sources: [{ title: "navypedia.org (japan/jap_bb_fuso78.htm)" }]
      armourScheme:
        value: "wrought iron; belt 229-114 (2.36 m high), battery 229, bulkheads 152"
        status: DERIVED
        sources: [{ title: "navypedia.org (japan/jap_bb_fuso78.htm)" }]
      armamentConfiguration:
        value: "4x1 235 mm (9.45-in) RKL/22 C/72 + 2x1 173 mm (6.7-in) RKL/25 C/72; 4x1 79 mm RKL/27 + 2x1 75 mm KL/11; no torpedo tubes as built (2x350 mm 1885)"
        status: DERIVED
        sources: [{ title: "navypedia.org (japan/jap_bb_fuso78.htm)" }]
      machineryOutput:
        value: "2 Penn HTC, 8 cylindrical boilers; 3,500 ihp"
        status: DERIVED
        sources: [{ title: "navypedia.org (japan/jap_bb_fuso78.htm)" }]
      speed:
        value: "13 kn"
        status: DERIVED
        sources: [{ title: "navypedia.org (japan/jap_bb_fuso78.htm)" }]
    draft:
      nationId: japan
      requirement:
        category: B
        requiredSpeedMilliKnots: 13000
        cruiseSpeedMilliKnots: 8000
        requiredRangeNm: 1800
        designThreatId: rml_10in
        modernizationExpectation: NONE
        crewQualityBp: 10000
        accommodationStandard: STANDARD
        protectionGoal: STANDARD
      hull:
        hullFormId: coast_defence_form
        lengthWl: 68900
        beam: 14600
        draught: 5490
        depthToMainDeck: 7500
        blockCoeffBp: 6000
        materialId: iron
        structuralSchemeId: mixed
        subdivisionGrade: 2
        targetDisplacementKg: 3717000
        limitDisplacementKg: null
        designMarginBp: 300
        growthReserveBp: 0
      machinery:
        plantId: compound_cylindrical
        installedKw: 3200
        zoneId: CENTRAL_MACHINERY
        stationPermille: 500
        fuelCapacityKg: 360000
        fuelZoneId: CENTRAL_MACHINERY
        fuelStationPermille: 510
        foulingBp: 0
      armour:
        regions:
          - {
              region: BELT_MAIN,
              thicknessUm: 229000,
              lengthMm: 68900,
              heightMm: 2400,
              materialId: wrought_iron,
              cosObliquityBp: 10000,
            }
          - {
              region: TURRET,
              thicknessUm: 229000,
              lengthMm: 40000,
              heightMm: 3000,
              materialId: wrought_iron,
              cosObliquityBp: 10000,
            }
          - {
              region: MAGAZINE_BOX,
              thicknessUm: 229000,
              lengthMm: 30000,
              heightMm: 2400,
              materialId: wrought_iron,
              cosObliquityBp: 10000,
            }
        citadelLengthMm: 45000
        torpedoWarheadKg: 0
        bunkerProtectionBp: 0
      placements:
        - {
            instanceId: main_p,
            componentId: gun_bl_235mm_rkl22,
            zoneId: SUPERSTRUCTURE,
            stationPermille: 560,
            side: PORT,
            params: { barrels: 2, rounds: 60 },
            magazineRef: mag_main,
          }
        - {
            instanceId: main_s,
            componentId: gun_bl_235mm_rkl22,
            zoneId: SUPERSTRUCTURE,
            stationPermille: 560,
            side: STBD,
            params: { barrels: 2, rounds: 60 },
            magazineRef: mag_main,
          }
        - {
            instanceId: sec_p,
            componentId: gun_bl_173mm_rkl25,
            zoneId: SUPERSTRUCTURE,
            stationPermille: 600,
            side: PORT,
            params: { barrels: 1, rounds: 100 },
            magazineRef: mag_sec,
          }
        - {
            instanceId: sec_s,
            componentId: gun_bl_173mm_rkl25,
            zoneId: SUPERSTRUCTURE,
            stationPermille: 600,
            side: STBD,
            params: { barrels: 1, rounds: 100 },
            magazineRef: mag_sec,
          }
        - {
