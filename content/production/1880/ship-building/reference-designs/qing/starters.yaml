# Reference designs for the EARLY band (starting points for the Drawing Board and regression fixtures).
# One directory per nation: starters.yaml (a `starterFor` opening design) and historical.yaml.
# Fittings (magazines, quarters, pumps, ventilation) weigh nothing extra (White 1894, ADR-0083).
designs:
  # Battleship starter for Qing China (doctrine template; cloned from alexandra_1877).
  - id: starter_b_qing_1880
    starterFor: B
    name: Battleship (starter, B) — Qing China
    month: 1880-01
    draft:
      nationId: qing
      requirement:
        category: B
        requiredSpeedMilliKnots: 15100
        cruiseSpeedMilliKnots: 8000
        requiredRangeNm: 2700
        designThreatId: rml_10in
        modernizationExpectation: MINOR
        crewQualityBp: 10000
        accommodationStandard: STANDARD
        protectionGoal: STANDARD
      hull:
        hullFormId: coast_defence_form
        lengthWl: 99100
        beam: 19500
        draught: 8000
        depthToMainDeck: 10500
        blockCoeffBp: 6000
        materialId: iron
        structuralSchemeId: mixed
        subdivisionGrade: 2
        targetDisplacementKg: 9492000
        limitDisplacementKg: null
        designMarginBp: 300
        growthReserveBp: 300
      machinery:
        plantId: compound_cylindrical
        installedKw: 7400
        zoneId: CENTRAL_MACHINERY
        stationPermille: 400
        fuelCapacityKg: 680000
        fuelZoneId: CENTRAL_MACHINERY
        fuelStationPermille: 450
        foulingBp: 0
        rooms:
          - { zoneId: CENTRAL_MACHINERY, stationPermille: 400, shareBp: 6000 }
          - { zoneId: AFT_SERVICE, stationPermille: 680, shareBp: 4000 }
      armour:
        regions:
          - {
              region: BELT_MAIN,
              thicknessUm: 305000,
              lengthMm: 70000,
              heightMm: 3200,
              materialId: wrought_iron,
              cosObliquityBp: 10000,
            }
          - {
              region: DECK_MAIN,
              thicknessUm: 55000,
              lengthMm: 99100,
              heightMm: 19500,
              materialId: wrought_iron,
              cosObliquityBp: 10000,
            }
          - {
              region: MAGAZINE_BOX,
              thicknessUm: 305000,
              lengthMm: 70000,
              heightMm: 3000,
              materialId: wrought_iron,
              cosObliquityBp: 10000,
            }
          - {
              region: TURRET,
              thicknessUm: 203000,
              lengthMm: 40000,
              heightMm: 3000,
              materialId: wrought_iron,
              cosObliquityBp: 10000,
            }
        citadelLengthMm: 70000
        torpedoWarheadKg: 30
        bunkerProtectionBp: 0
      placements:
        - {
            instanceId: main_fwd,
            componentId: gun_rml_11in_25ton,
            zoneId: FORECASTLE,
            stationPermille: 40,
            params: { barrels: 2, rounds: 100 },
            magazineRef: mag_fwd,
          }
        - {
            instanceId: sec_p,
            componentId: gun_rml_10in_18ton_broadside,
            zoneId: SUPERSTRUCTURE,
            stationPermille: 560,
            side: PORT,
            params: { barrels: 5, rounds: 100 },
            magazineRef: mag_sec,
          }
        - {
            instanceId: sec_s,
            componentId: gun_rml_10in_18ton_broadside,
            zoneId: SUPERSTRUCTURE,
            stationPermille: 560,
            side: STBD,
            params: { barrels: 5, rounds: 100 },
            magazineRef: mag_sec,
          }
        - {
            instanceId: tubes,
            componentId: tube_14in_above_water,
            zoneId: QUARTERDECK,
            stationPermille: 900,
            params: { tubes: 4 },
          }
        - {
            instanceId: mag_sec,
            componentId: magazine_heavy,
            zoneId: SUPERSTRUCTURE,
            stationPermille: 560,
          }
        - {
            instanceId: mag_fwd,
            componentId: magazine_heavy,
            zoneId: FWD_MAGAZINE,
            stationPermille: 130,
          }
        - {
            instanceId: mag_aft,
            componentId: magazine_heavy,
            zoneId: AFT_MAGAZINE,
            stationPermille: 820,
          }
        - { instanceId: dyn, componentId: dynamo_small, zoneId: AFT_SERVICE, stationPermille: 690 }
