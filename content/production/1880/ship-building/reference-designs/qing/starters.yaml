          }
        - {
            instanceId: quarters,
            componentId: quarters_crew,
            zoneId: FWD_SERVICE,
            stationPermille: 250,
            params: { blocks: 95 },
          }
        - {
            instanceId: funnel_a,
            componentId: funnel_single,
            zoneId: SUPERSTRUCTURE,
            stationPermille: 580,
