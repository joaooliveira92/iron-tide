# Reference designs for the EARLY band (starting points for the Drawing Board and regression fixtures).
# One directory per nation: starters.yaml (a `starterFor` opening design) and historical.yaml.
# Fittings (magazines, quarters, pumps, ventilation) weigh nothing extra (White 1894, ADR-0083).
designs:
  # Canonicus (1864, in service Jan 1880): US coast-defence monitor, 2,100 t, 8 kn, 1 x 2 15-in Dahlgren SMOOTHBORE in
  # a turret, 127 mm side / 254 mm turret iron. Promoted to the US capital (B) starter (ADR-0117), replacing the British
  # doctrine clone. Source: docs/research/ship-building-1880-ships-by-nation.md §6.5; gun: docs/research/ship-building-1880-coast-defence-armament.md §2.5.
  - id: canonicus_1879
    starterFor: B
    name: Canonicus (1864/1880, coast-defence monitor)
    month: 1880-01
    historical: true
    provenance:
      completionDate:
        value: "16.4.1864 (Canonicus class 1864-71; several in service Jan 1880)"
        status: DERIVED
        sources: [{ title: "navypedia.org (usa/us_mon_canonicus.htm)" }]
      displacementBasis:
        value: "2,100 t normal"
        status: DERIVED
        sources: [{ title: "navypedia.org (usa/us_mon_canonicus.htm)" }]
      armourScheme:
        value: "wrought iron; side 127-76, turret 254, deck 38"
        status: DERIVED
        sources: [{ title: "navypedia.org (usa/us_mon_canonicus.htm)" }]
      armamentConfiguration:
        value: "1x2 381 mm (15-in) long Dahlgren smoothbore in 1 turret; no torpedoes"
        status: DERIVED
        sources: [{ title: "navypedia.org (usa/us_mon_canonicus.htm)" }]
      machineryOutput:
        value: "1 Ericsson VL, 2 boilers; 320 ihp"
        status: DERIVED
        sources: [{ title: "navypedia.org (usa/us_mon_canonicus.htm)" }]
      speed:
        value: "8 kn"
        status: DERIVED
        sources: [{ title: "navypedia.org (usa/us_mon_canonicus.htm)" }]
    draft:
      nationId: usa
      requirement:
        category: B
        requiredSpeedMilliKnots: 8000
        cruiseSpeedMilliKnots: 6000
        requiredRangeNm: 1200
        designThreatId: qf_6in
        modernizationExpectation: NONE
        crewQualityBp: 10000
        accommodationStandard: SPARTAN
        protectionGoal: STANDARD
      hull:
        hullFormId: coast_defence_form
        lengthWl: 68300
        beam: 13200
        draught: 3900
        depthToMainDeck: 5500
        blockCoeffBp: 6000
        materialId: iron
        structuralSchemeId: transverse
        subdivisionGrade: 1
        targetDisplacementKg: 2100000
        limitDisplacementKg: null
        designMarginBp: 300
        growthReserveBp: 0
      machinery:
        plantId: compound_cylindrical
        installedKw: 420
        zoneId: CENTRAL_MACHINERY
        stationPermille: 500
        fuelCapacityKg: 145000
        fuelZoneId: CENTRAL_MACHINERY
        fuelStationPermille: 510
        foulingBp: 0
        rooms:
          - { zoneId: CENTRAL_MACHINERY, stationPermille: 500, shareBp: 6000 }
          - { zoneId: AFT_SERVICE, stationPermille: 700, shareBp: 4000 }
      armour:
        regions:
          - {
              region: BELT_MAIN,
              thicknessUm: 127000,
              lengthMm: 68300,
              heightMm: 3000,
              materialId: wrought_iron,
              cosObliquityBp: 10000,
            }
          - {
              region: DECK_MAIN,
              thicknessUm: 38000,
              lengthMm: 68300,
              heightMm: 13200,
              materialId: wrought_iron,
              cosObliquityBp: 10000,
            }
          - {
              region: TURRET,
              thicknessUm: 254000,
              lengthMm: 6000,
              heightMm: 4000,
              materialId: wrought_iron,
              cosObliquityBp: 10000,
            }
          - {
