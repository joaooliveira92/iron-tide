<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Armour scheme selector — prototype</title>
<style>
  :root { color-scheme: dark; --ink:#e8ecf1; --mut:#9aa6b2; --line:#33404d; --accent:#69b7ff; --belt:#c9a227; --deck:#7f8c8d; --slope:#b06ad0; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 system-ui,sans-serif; background:#0f151b; color:var(--ink); }
  header { padding:12px 16px; border-bottom:1px solid var(--line); }
  header small { color:var(--mut); }
  main { display:grid; grid-template-columns: 260px 1fr; gap:0; min-height:80vh; }
  nav { border-right:1px solid var(--line); padding:12px; display:flex; flex-direction:column; gap:8px; }
  nav button { text-align:left; padding:10px 12px; background:#16202a; color:var(--ink); border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  nav button[aria-pressed="true"] { border-color:var(--accent); box-shadow:inset 3px 0 0 var(--accent); }
  nav button.locked { opacity:.55; }
  nav button .tag { display:block; font-size:11px; color:var(--mut); }
  section.panel { padding:16px; }
  svg { background:#0b1015; border:1px solid var(--line); border-radius:8px; width:100%; height:auto; }
  table { border-collapse:collapse; margin-top:14px; width:100%; }
  th,td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--mut); font-weight:600; }
  .custom { color:var(--mut); font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<header>
  <strong>Armour scheme selector — prototype</strong>
  <small>cheap throwaway (map #152 / ticket #160). Not merged; nothing authoritative here.</small>
</header>
<main>
  <nav id="schemes"></nav>
  <section class="panel">
    <svg id="diagram" viewBox="0 0 640 240" role="img" aria-label="side armour scheme"></svg>
    <div class="custom" id="status"></div>
    <table>
      <thead><tr><th>Field</th><th>Region</th><th>Thickness</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</main>
<script>
// Prototype only. Values are placeholders to make the shape legible; not a spec.
const FIELDS = [
  ["B  Belt", "BELT_MAIN"],
  ["BU Upper belt", "BELT_UPPER"],
  ["BE Belt extended", "BELT_ENDS"],
  ["D  Deck", "DECK_MAIN"],
  ["DE Deck extended", "DECK_EXTENDED"],
  ["T  Turret + barbette", "TURRET"],
  ["TT Turret top", "TURRET_TOP"],
  ["SEC Secondary gun armour", "SECONDARY_GUN"],
  ["CT Conning tower", "CONNING_TOWER"],
];
const SCHEMES = {
  FLAT_DECK_ON_BELT: { name:"Flat deck on top of belt", tag:"in-era · 1880 default", locked:false,
    draw:{ belt:true, upperBelt:true, deck:true, deckExt:true, slope:false }, fitted:["BELT_MAIN","BELT_UPPER","BELT_ENDS","DECK_MAIN","DECK_EXTENDED","TURRET","TURRET_TOP","SECONDARY_GUN","CONNING_TOWER"] },
  PROTECTED_CRUISER: { name:"Protected cruiser", tag:"in-era · cruiser types", locked:false,
    draw:{ belt:false, upperBelt:false, deck:true, deckExt:false, slope:true }, fitted:["DECK_SLOPE","DECK_MAIN","TURRET","TURRET_TOP","SECONDARY_GUN","CONNING_TOWER"] },
  BELT_AND_SLOPING_DECK: { name:"Belt and sloping deck", tag:"gated · WW1", locked:true,
    draw:{ belt:true, upperBelt:false, deck:true, deckExt:false, slope:true }, fitted:["BELT_MAIN","BELT_ENDS","DECK_MAIN","DECK_SLOPE","TURRET","TURRET_TOP","SECONDARY_GUN","CONNING_TOWER"] },
  ALL_OR_NOTHING: { name:"All or Nothing", tag:"gated · researched", locked:true,
    draw:{ belt:true, upperBelt:false, deck:true, deckExt:false, slope:false, citadelOnly:true }, fitted:["BELT_MAIN","DECK_MAIN","TURRET","TURRET_TOP","CONNING_TOWER"] },
};
let current = "FLAT_DECK_ON_BELT";
let custom = false;
const nav = document.getElementById("schemes");
for (const [id, s] of Object.entries(SCHEMES)) {
  const b = document.createElement("button");
  b.className = s.locked ? "locked" : "";
  b.setAttribute("aria-pressed", String(id === current));
  b.innerHTML = (s.locked ? "🔒 " : "") + s.name + '<span class="tag">' + s.tag + "</span>";
  b.onclick = () => { if (s.locked) { flash(); return; } current = id; custom = false; render(); };
  nav.appendChild(b);
}
function flash(){ const st=document.getElementById("status"); st.textContent="Locked: needs the technology researched (ADR-0229 year)."; }
function render() {
  const s = SCHEMES[current];
  const d = s.draw;
  const parts = [];
  parts.push('<rect x="40" y="150" width="560" height="40" fill="none" stroke="#33404d"/>');
  if (d.belt) parts.push('<rect x="'+(d.citadelOnly?200:120)+'" y="150" width="'+(d.citadelOnly?240:400)+'" height="26" fill="var(--belt)" opacity=".8"/>');
  if (d.upperBelt) parts.push('<rect x="120" y="150" width="400" height="10" fill="var(--belt)" opacity=".45"/>');
  if (d.deck) parts.push('<line x1="'+(d.citadelOnly?200:120)+'" y1="150" x2="'+(d.citadelOnly?440:520)+'" y2="150" stroke="var(--deck)" stroke-width="6"/>');
  if (d.deckExt) parts.push('<line x1="120" y1="150" x2="520" y2="150" stroke="var(--deck)" stroke-width="3" stroke-dasharray="6 4"/>');
  if (d.slope) parts.push('<line x1="120" y1="188" x2="520" y2="130" stroke="var(--slope)" stroke-width="6"/>');
  parts.push('<rect x="330" y="120" width="46" height="30" fill="none" stroke="var(--accent)" stroke-width="2"/>');
  parts.push('<text x="356" y="140" fill="var(--accent)" font-size="11" text-anchor="middle">T</text>');
  parts.push('<line x1="330" y1="120" x2="376" y2="120" stroke="var(--accent)" stroke-width="4"/>');
  document.getElementById("diagram").innerHTML = parts.join("");
  const rows = document.getElementById("rows");
  rows.innerHTML = FIELDS.map(([label, region]) => {
    const fitted = s.fitted.includes(region);
    return "<tr><td>"+label+"</td><td>"+region+"</td><td>"+(fitted?"$(value)":"—")+"</td></tr>";
  }).join("").replaceAll("$(value)", (custom?"custom":"preset"));
  document.getElementById("status").textContent = "Scheme: " + s.name + (custom ? " (Custom)" : "") + ". Editing any region flips the label to Custom.";
  [...nav.children].forEach((b,i)=>b.setAttribute("aria-pressed", String(Object.keys(SCHEMES)[i] === current)));
}
render();
</script>
</body>
</html>
